name: release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

env:
  OutputArch: "windows-64"
  OutputArchArm: "windows-arm64"
  OutputPath64:  "${{ github.workspace }}/v2rayN/Release/windows-64"
  OutputPathArm64:  "${{ github.workspace }}/v2rayN/Release/windows-arm64"

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Setup
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: |
        cd v2rayN 
        dotnet publish ./v2rayN/v2rayN.csproj     -c Release -r win-x64   -p:SelfContained=true -p:EnableWindowsTargeting=true -o $OutputPath64
        dotnet publish ./v2rayN/v2rayN.csproj     -c Release -r win-arm64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o $OutputPathArm64
        dotnet publish ./AmazTool/AmazTool.csproj -c Release -r win-x64   -p:SelfContained=true -p:EnableWindowsTargeting=true -p:PublishTrimmed=true -o $OutputPath64
        dotnet publish ./AmazTool/AmazTool.csproj -c Release -r win-arm64 -p:SelfContained=true -p:EnableWindowsTargeting=true -p:PublishTrimmed=true -o $OutputPathArm64
  
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7.0.0
      with:
        name: v2rayN-windows
        path: |
          ${{ github.workspace }}/v2rayN/Release/windows*
    
    # release zip archive
    - name: Package release zip archive
      if: github.event.inputs.release_tag != ''
      run: |
        chmod 755 package-release-zip.sh
        ./package-release-zip.sh $OutputArch $OutputPath64
        ./package-release-zip.sh $OutputArchArm $OutputPathArm64
    
    - name: Upload zip archive to release
      uses: svenstaro/upload-release-action@v2
      if: github.event.inputs.release_tag != ''
      with:
        file: ${{ github.workspace }}/v2rayN*.zip
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
        overwrite: true
        prerelease: true

  package_release:
    if: github.event.inputs.release_tag != ''
    needs: build
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: v2rayN-windows
        path: ${{ github.workspace }}/dist/windows

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --no-progress -y

    - name: Package Windows installer
      shell: pwsh
      run: |
        $releaseTag = "${{ github.event.inputs.release_tag }}"
        if ([string]::IsNullOrWhiteSpace($releaseTag)) {
          throw "Missing release tag"
        }

        $version = $releaseTag.TrimStart("v")
        $installerDir = Join-Path $env:GITHUB_WORKSPACE "dist\installer"
        New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

        & iscc "/DMyAppVersion=$version" "/DMyAppArch=windows-64" "/DMySourceDir=$env:GITHUB_WORKSPACE\dist\windows\windows-64" "/DMyOutputDir=$installerDir" "$env:GITHUB_WORKSPACE\installer\windows\v2rayN.iss"
        & iscc "/DMyAppVersion=$version" "/DMyAppArch=windows-arm64" "/DMySourceDir=$env:GITHUB_WORKSPACE\dist\windows\windows-arm64" "/DMyOutputDir=$installerDir" "$env:GITHUB_WORKSPACE\installer\windows\v2rayN.iss"

    - name: Upload Windows installers
      uses: actions/upload-artifact@v7.0.0
      with:
        name: v2rayN-windows-installers
        path: |
          ${{ github.workspace }}/dist/installer/*.exe

    - name: Upload installer to release
      uses: svenstaro/upload-release-action@v2
      with:
        file: ${{ github.workspace }}/dist/installer/*.exe
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
        overwrite: true
        prerelease: true
