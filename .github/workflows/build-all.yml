name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Trigger Windows and macOS releases
        run: |
          gh workflow run build-windows.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
          gh workflow run build-osx.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
